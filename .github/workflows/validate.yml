name: Validate skill and compiler
on: [push, pull_request]
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/check_pipeline.py
      - run: python3 tests/check_validator.py
      - run: node tests/check_estimator.mjs
